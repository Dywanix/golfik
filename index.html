<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Arcade: Editor Pro</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
    <style>
        :root { --sky: #87CEEB; --grass: #2d8a39; --dark: #2c3e50; --gold: #f1c40f; --red: #e74c3c; --white: #ffffff; --ice: #a0e7ff; --sand: #d2b48c; }
        body { margin: 0; overflow: hidden; background: var(--sky); font-family: 'Segoe UI', sans-serif; color: var(--dark); }
        canvas { display: block; }
        .screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(135, 206, 235, 0.98); z-index: 100; overflow-y: auto; padding: 20px; }
        .hidden { display: none !important; }
        .box { background: var(--white); padding: 30px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); text-align: center; width: 100%; max-width: 480px; border: 4px solid white; }
        button { background: var(--grass); color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 12px; cursor: pointer; transition: 0.2s; font-weight: bold; margin: 5px; }
        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        .btn-gold { background: var(--gold); color: #000; border: 2px solid #b8860b; }
        .btn-red { background: var(--red); }
        .level-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; margin-top: 80px; padding-bottom: 50px; }
        .level-card { background: white; border-radius: 18px; padding: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        .thumb { background: #eee; border-radius: 10px; width: 100%; height: 110px; cursor: pointer; border: 1px solid #ddd; display: block; margin: 0 auto; }
        .scroll-list { margin-top: 15px; overflow-y: auto; max-height: 250px; border-radius: 12px; background: #f8f9fa; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background: #eee; padding: 10px; position: sticky; top: 0; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        #ui { position: absolute; top: 20px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; pointer-events: none; color: white; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); z-index: 50; box-sizing: border-box; font-size: 18px; }
        #ui .btns { pointer-events: auto; }
        #editorUI { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 12px 20px; border-radius: 50px; display: flex; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); z-index: 200; flex-wrap: wrap; justify-content: center; width: 95%; max-width: 800px; align-items: center; }
        .tool { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #ddd; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; background: white; }
        .tool.active { border-color: var(--grass); background: #eef9ee; transform: scale(1.1); }
    </style>
</head>
<body>

<div id="screenLogin" class="screen">
    <div class="box">
        <h1>⛳ Geo Arcade</h1>
        <input type="text" id="nickInput" placeholder="Enter Nickname..." maxlength="15" style="padding:12px; width:80%; margin-bottom:15px; border-radius:10px; border:2px solid #ddd; text-align:center;">
        <br><button onclick="login()">START</button>
    </div>
</div>

<div id="screenMenu" class="screen hidden">
    <div class="box">
        <button class="btn-gold" style="width:100%" onclick="playDaily()">📅 DAILY CHALLENGE</button>
        <div style="display:flex; gap:10px;">
            <button style="flex:1" onclick="showCommunity()">🌐 COMMUNITY</button>
            <button style="flex:1; background:var(--dark)" onclick="openEditor()">🛠️ EDITOR</button>
        </div>
        <button style="width:100%; background:#777;" onclick="showHowTo()">❓ HOW TO PLAY</button>
        <div class="scroll-list">
            <table>
                <thead><tr><th>#</th><th>Player</th><th>Shots</th><th>Time</th></tr></thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="screenHowTo" class="screen hidden">
    <div class="box">
        <h2>How to Play</h2>
        <div style="text-align:left; font-size:14px; line-height:1.6;">
            <p>🎯 <b>Drag:</b> Pull back from the ball to shoot.</p>
            <p>⚡ <b>Bouncers:</b> Yellow blocks boost speed.</p>
            <p>🏆 <b>Ranking:</b> Lower shots win. If shots are tied, faster time wins!</p>
        </div>
        <button onclick="showMenu()" style="width:100%">BACK</button>
    </div>
</div>

<div id="screenCommunity" class="screen hidden" style="align-items:flex-start;">
    <button class="btn-red" style="position:fixed; top:20px; left:20px; z-index:1100;" onclick="showMenu()">⬅ BACK</button>
    <div class="level-grid" id="levelGrid"></div>
</div>

<div id="screenWin" class="screen hidden">
    <div class="box">
        <h2 style="color:var(--grass)">GOAL!</h2>
        <p>Shots: <b id="winScore">0</b> | Time: <b id="winTime">0</b>s</p>
        <button onclick="showMenu()">CONTINUE</button>
    </div>
</div>

<div id="ui" class="hidden">
    <div>SHOTS: <span id="uiScore">0</span> | TIME: <span id="uiTimer">0.0</span>s</div>
    <div class="btns"><button onclick="resetBall()" style="background:var(--gold); color:black;">RESET</button> <button onclick="showMenu()" style="background:var(--red);">EXIT</button></div>
</div>

<div id="editorUI" class="hidden">
    <button class="btn-red" onclick="exitEditor()" style="padding: 8px 15px; font-size: 12px;">EXIT</button>
    <div style="width: 2px; height: 30px; background: #eee; margin: 0 5px;"></div>
    <div class="tool active" onclick="setTool('box', this)">⬛</div>
    <div class="tool" onclick="setTool('bouncer', this)" style="background:var(--gold)">⚡</div>
    <div class="tool" onclick="setTool('ice', this)" style="background:var(--ice)">❄️</div>
    <div class="tool" onclick="setTool('sand', this)" style="background:var(--sand)">⏳</div>
    <div class="tool" onclick="setTool('slopeL', this)">📐</div>
    <div class="tool" onclick="setTool('slopeR', this)">📐</div>
    <div class="tool" onclick="setTool('goal', this)">🚩</div>
    <div class="tool" onclick="setTool('start', this)">⚪</div>
    <div class="tool" onclick="setTool('eraser', this)">❌</div>
    <button class="btn-gold" onclick="publishLevel()">🚀 PUBLISH</button>
</div>

<canvas id="canvas"></canvas>

<script>
// --- AUDIO ---
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSfx(freq, type, dur, vol=0.1) {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + dur);
}

// --- FIREBASE ---
const firebaseConfig = {
    apiKey: "AIzaSyD5PBPsfXJreHIn5BQIf1q45GwWMdhLB3g",
    authDomain: "geo-arcade-game.firebaseapp.com",
    projectId: "geo-arcade-game",
    storageBucket: "geo-arcade-game.firebasestorage.app",
    messagingSenderId: "1063187573284",
    appId: "1:1063187573284:web:8aab472b7bded9fe9786b1",
    databaseURL: "https://geo-arcade-game-default-rtdb.europe-west1.firebasedatabase.app/" 
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// --- STATE ---
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');
let w, h, nick = localStorage.getItem('arc_v11_nick') || "";
let paused = true, isEditing = false, currentTool = 'box', isDaily = false;
let shots = 0, timeStart = 0, m = {x:0, y:0}, dragStart = null, shootStart = null;
let hasHit = false;

const ball = { x: 100, y: 100, vx: 0, vy: 0, r: 7, grav: 0.25, bounce: 0.3, fric: 0.97, onG: false };
let level = { shapes: [], gx: 0.8, gy: 0.8, sx: 100, sy: 100, name: "" };

// --- UI & LEADERBOARD ---
function login() {
    const v = document.getElementById('nickInput').value.trim();
    if(v.length < 3) return alert("Nickname too short!");
    nick = v; localStorage.setItem('arc_v11_nick', nick);
    showMenu();
}
function showMenu() {
    paused = true; isEditing = false;
    document.querySelectorAll('.screen, #ui, #editorUI').forEach(s => s.classList.add('hidden'));
    document.getElementById('screenMenu').classList.remove('hidden');
    loadLeaderboard();
}
function exitEditor() {
    if(level.shapes.length > 0 && !confirm("Exit without saving?")) return;
    showMenu();
}
function showHowTo() {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('screenHowTo').classList.remove('hidden');
}

async function loadLeaderboard() {
    const today = new Date().toISOString().slice(0, 10);
    const snap = await db.ref('scores/' + today).orderByValue().limitToFirst(15).once('value');
    const tb = document.getElementById('leaderboardBody'); tb.innerHTML = "";
    let r = 1;
    snap.forEach(c => {
        const val = c.val();
        const s = Math.floor(val);
        const t = ((val - s) * 1000).toFixed(1);
        tb.innerHTML += `<tr><td>${r++}</td><td>${c.key}</td><td>${s}</td><td>${t}s</td></tr>`;
    });
}

// --- COMMUNITY ---
async function showCommunity() {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('screenCommunity').classList.remove('hidden');
    const snap = await db.ref('levels').limitToLast(24).once('value');
    const grid = document.getElementById('levelGrid'); grid.innerHTML = "";
    snap.forEach(c => {
        const l = c.val();
        const card = document.createElement('div'); card.className = 'level-card';
        card.innerHTML = `<canvas id="t-${c.key}" class="thumb" width="200" height="110" onclick="playCustom('${c.key}')"></canvas>
            <div style="font-size:12px; margin-top:8px;"><b>${l.name}</b> by ${l.author}</div>`;
        grid.appendChild(card);
        drawThumb(`t-${c.key}`, l);
    });
}
function drawThumb(id, l) {
    const tc = document.getElementById(id).getContext('2d');
    tc.fillStyle = '#87CEEB'; tc.fillRect(0,0,200,110);
    l.shapes.forEach(s => {
        tc.fillStyle = s.t==='bouncer'?'#f1c40f':s.t==='ice'?'#a0e7ff':s.t==='sand'?'#d2b48c':'#2d8a39';
        if(!s.t.includes('slope')) tc.fillRect(s.x*200, s.y*110, s.w*200, s.h*110);
    });
}

// --- PHYSICS ---
function update() {
    if (paused || isEditing) return;
    let elapsed = (Date.now() - timeStart) / 1000;
    document.getElementById('uiTimer').innerText = elapsed.toFixed(1);
    
    ball.vy += ball.grav; ball.x += ball.vx; ball.y += ball.vy; ball.onG = false;

    let col = false;
    level.shapes.forEach(s => {
        const sx = s.x*w, sy = s.y*h, sw = s.w*w, sh = s.h*h;
        if(!s.t.includes('slope')) {
            if(ball.x+ball.r > sx && ball.x-ball.r < sx+sw && ball.y+ball.r > sy && ball.y-ball.r < sy+sh) {
                col = true;
                const ox = Math.min(ball.x+ball.r-sx, sx+sw-(ball.x-ball.r));
                const oy = Math.min(ball.y+ball.r-sy, sy+sh-(ball.y-ball.r));
                let bnc = ball.bounce, frc = ball.fric;
                if(s.t==='bouncer') { bnc=1.2; if(!hasHit) playSfx(400,'square',0.1); }
                else if(s.t==='ice') { frc=0.999; }
                else if(s.t==='sand') { frc=0.7; }
                
                if(!hasHit && (Math.abs(ball.vx) > 1.5 || Math.abs(ball.vy) > 1.5)) {
                    playSfx(150 + Math.abs(ball.vy)*10, 'sine', 0.1);
                    hasHit = true; 
                }
                if(ox < oy) { ball.vx *= -bnc; ball.x += (ball.x < sx+sw/2)?-ox:ox; }
                else { if(ball.vy > 0) ball.onG = true; ball.vy *= -bnc; ball.y += (ball.y < sy+sh/2)?-oy:oy; ball.vx *= frc; }
            }
        } else {
            if(ball.x > sx && ball.x < sx+sw) {
                let slpY = s.t==='slopeL'?sy+(sh*(ball.x-sx)/sw):sy+(sh*(1-(ball.x-sx)/sw));
                if(ball.y+ball.r > slpY && ball.y < sy+sh) { ball.y = slpY-ball.r; ball.vy *= -ball.bounce; ball.vx += (s.t==='slopeL'?-0.2:0.2); ball.onG = true; }
            }
        }
    });
    if(!col) hasHit = false;

    if(Math.hypot(ball.x - level.gx*w, ball.y - level.gy*h) < 20 && Math.abs(ball.vx) < 1.5) {
        paused = true; 
        playSfx(600,'sine',0.5);
        if(isDaily) {
            const today = new Date().toISOString().slice(0, 10);
            const scoreIndex = shots + (elapsed / 1000);
            db.ref(`scores/${today}/${nick}`).set(scoreIndex);
        }
        document.getElementById('winScore').innerText = shots;
        document.getElementById('winTime').innerText = elapsed.toFixed(1);
        document.getElementById('screenWin').classList.remove('hidden');
    }
    if(ball.y > h || ball.x < 0 || ball.x > w) resetBall();
}

function draw() {
    ctx.fillStyle = '#87CEEB'; ctx.fillRect(0,0,w,h);
    level.shapes.forEach(s => {
        ctx.fillStyle = s.t==='bouncer'?'#f1c40f':s.t==='ice'?'#a0e7ff':s.t==='sand'?'#d2b48c':'#2d8a39';
        if(!s.t.includes('slope')) ctx.fillRect(s.x*w, s.y*h, s.w*w, s.h*h);
        else {
            ctx.beginPath();
            if(s.t==='slopeL') { ctx.moveTo(s.x*w, s.y*h); ctx.lineTo(s.x*w, (s.y+s.h)*h); ctx.lineTo((s.x+s.w)*w, (s.y+s.h)*h); }
            else { ctx.moveTo((s.x+s.w)*w, s.y*h); ctx.lineTo(s.x*w, (s.y+s.h)*h); ctx.lineTo((s.x+s.w)*w, (s.y+s.h)*h); }
            ctx.fill();
        }
    });
    ctx.fillStyle = 'red'; ctx.beginPath(); ctx.arc(level.gx*w, level.gy*h, 15, 0, 7); ctx.fill();
    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fill();
    if(shootStart) {
        ctx.setLineDash([5, 5]); ctx.strokeStyle='white'; ctx.beginPath();
        ctx.moveTo(ball.x, ball.y); ctx.lineTo(ball.x + (shootStart.x-m.x), ball.y + (shootStart.y-m.y)); ctx.stroke();
    }
    if(isEditing && dragStart) { ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(dragStart.x, dragStart.y, m.x-dragStart.x, m.y-dragStart.y); }
    update(); requestAnimationFrame(draw);
}

// --- TOOLS ---
function setTool(t, el) { currentTool = t; document.querySelectorAll('.tool').forEach(b => b.classList.remove('active')); el.classList.add('active'); }
function resetBall() { ball.x = level.sx; ball.y = level.sy; ball.vx = 0; ball.vy = 0; }
async function playCustom(id) { isDaily = false; const snap = await db.ref('levels/' + id).once('value'); startLevel(snap.val()); }
function playDaily() { isDaily = true; startLevel({ shapes: [{t:'box', x:0, y:0.8, w:1, h:0.2}], gx:0.9, gy:0.75, sx:100, sy:100, name: "Daily" }); }
function startLevel(l) {
    level = JSON.parse(JSON.stringify(l)); shots = 0; timeStart = Date.now();
    document.getElementById('uiScore').innerText = "0";
    resetBall(); paused = false; isEditing = false;
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('ui').classList.remove('hidden'); resize();
}
function openEditor() {
    isEditing = true; paused = false;
    level = { shapes: [], gx: 0.9, gy: 0.9, sx: 100, sy: 100, name: nick + "'s Map" };
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    document.getElementById('editorUI').classList.remove('hidden');
    resize();
}
async function publishLevel() {
    const n = prompt("Name:"); if(!n) return;
    await db.ref('levels').push({ ...level, author: nick, name: n });
    showMenu();
}

cvs.addEventListener('mousedown', e => {
    m = {x: e.clientX, y: e.clientY};
    if(isEditing) {
        if(['box','bouncer','ice','sand','slopeL','slopeR'].includes(currentTool)) dragStart = {x:m.x, y:m.y};
        else if(currentTool==='goal') { level.gx=m.x/w; level.gy=m.y/h; }
        else if(currentTool==='start') { level.sx=m.x; level.sy=m.y; }
        else if(currentTool==='eraser') level.shapes = level.shapes.filter(s => !(m.x/w > s.x && m.x/w < s.x+s.w && m.y/h > s.y && m.y/h < s.y+s.h));
    } else if(!paused && ball.onG) shootStart = {x:m.x, y:m.y};
});
cvs.addEventListener('mousemove', e => m = {x: e.clientX, y: e.clientY});
cvs.addEventListener('mouseup', e => {
    if(dragStart) {
        const bw = Math.abs(m.x-dragStart.x)/w, bh = Math.abs(m.y-dragStart.y)/h;
        if(bw > 0.01) level.shapes.push({t: currentTool, x: Math.min(dragStart.x, m.x)/w, y: Math.min(dragStart.y, m.y)/h, w: bw, h: bh});
        dragStart = null;
    }
    if(shootStart) {
        ball.vx = (shootStart.x - m.x)*0.15; ball.vy = (shootStart.y - m.y)*0.15;
        shots++; document.getElementById('uiScore').innerText = shots;
        playSfx(200,'triangle',0.2); shootStart = null;
    }
});

function resize() { w = cvs.width = window.innerWidth; h = cvs.height = window.innerHeight; }
window.onresize = resize;
if(nick) showMenu();
resize(); draw();
</script>
</body>
</html>
